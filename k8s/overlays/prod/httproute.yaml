apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autosupply-httproute
  namespace: autosupply
spec:
  parentRefs:
    - name: external-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      backendRefs:
        - name: auth-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/suppliers
      backendRefs:
        - name: supplier-service
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/components
      backendRefs:
        - name: component-service
          port: 8003
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/purchase-orders
        - path:
            type: PathPrefix
            value: /api/v1/dashboard
      backendRefs:
        - name: order-service
          port: 8004
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000

