apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: autosupply-aws-secrets
  namespace: autosupply
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "rds!db-fcc254ae-6cc4-4013-95ed-0d325d04baaf"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db_username
          - path: password
            objectAlias: db_password
          - path: host
            objectAlias: db_host
          - path: port
            objectAlias: db_port
  secretObjects:
    - secretName: autosupply-secrets
      type: Opaque
      data:
        - objectName: db_username
          key: DB_USER
        - objectName: db_password
          key: DB_PASSWORD
        - objectName: db_host
          key: DB_HOST
        - objectName: db_port
          key: DB_PORT
