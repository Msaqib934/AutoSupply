apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: autosupply

resources:
  - ../../base

images:
  - name: autosupply-frontend
    newName: autosupply-frontend
    newTag: latest
  - name: autosupply-auth-service
    newName: autosupply-auth-service
    newTag: latest
  - name: autosupply-supplier-service
    newName: autosupply-supplier-service
    newTag: latest
  - name: autosupply-component-service
    newName: autosupply-component-service
    newTag: latest
  - name: autosupply-order-service
    newName: autosupply-order-service
    newTag: latest
