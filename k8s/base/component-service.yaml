apiVersion: apps/v1
kind: Deployment
metadata:
  name: component-service
  labels:
    app: component-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: component-service
  template:
    metadata:
      labels:
        app: component-service
    spec:
      serviceAccountName: my-app-sa
      containers:
        - name: component-service
          image: autosupply-component-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autosupply-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "database-1.cperf7tnhj6s.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/autosupply_component"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "autosupply-aws-secrets"
---
apiVersion: v1
kind: Service
metadata:
  name: component-service
  labels:
    app: component-service
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      name: http
  selector:
    app: component-service
