apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: autosupply-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: PORT
              value: "8004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autosupply-secrets
                  key: ORDER_DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: autosupply-secrets
                  key: SECRET_KEY
            - name: SUPPLIER_SERVICE_URL
              value: "http://supplier-service:8002"
            - name: COMPONENT_SERVICE_URL
              value: "http://component-service:8003"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: order-service
