name: CD - Deploy with ArgoCD

on:
  workflow_run:
    workflows: ["CI - Build & Push to AWS ECR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Only Built Images in Kustomize
        run: |
          cd k8s/overlays/prod
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TAG="${{ github.event.workflow_run.head_sha }}"

          echo "Target tag from CI run: $TAG"

          # Function to verify image tag existence in ECR before patching Kustomize
          update_if_exists() {
            local service_name="$1"
            local repo_name="autosupply-${service_name}"

            echo "Checking ECR for $repo_name:$TAG..."
            if aws ecr describe-images \
              --repository-name "$repo_name" \
              --image-ids imageTag="$TAG" \
              --region "${{ secrets.AWS_REGION }}" > /dev/null 2>&1; then
              echo "==> Tag $TAG exists in ECR. Updating Kustomize for $repo_name..."
              kustomize edit set image "autosupply-${service_name}=$REGISTRY/${repo_name}:$TAG"
            else
              echo "==> Skipping $repo_name: Tag $TAG not found in ECR (not built in this CI run)."
            fi
          }

          # Check and update all services selectively
          update_if_exists "frontend"
          update_if_exists "auth-service"
          update_if_exists "supplier-service"
          update_if_exists "component-service"
          update_if_exists "order-service"

      - name: Commit & Push to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(cd): bump k8s manifests to ${{ github.event.workflow_run.head_sha }} [skip ci]"
            git push origin main
          fi
